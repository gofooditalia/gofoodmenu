name: Test menu pubblico

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # Fisso: ubuntu-latest è passato a 26.04 e Playwright 1.56 non vi installa Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Chiavi pubbliche di Supabase (le stesse del browser): sola lettura dei menu pubblici
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # Valori finti: src/lib/stripe.ts e la rotta del webhook Stripe creano i loro client già in
      # compilazione, ma i test non chiamano mai Stripe né usano la chiave di servizio di Supabase
      STRIPE_SECRET_KEY: sk_test_finto_solo_per_build
      SUPABASE_SERVICE_ROLE_KEY: finta_solo_per_build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
